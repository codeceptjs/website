<!-- H = 80 + 308 (cards 300 + 8 top face) + 80 + 12 = 480 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="1100" height="480">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400..700&amp;display=swap');
      .kicker { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 11px; letter-spacing: 0.20em; text-transform: uppercase; }
      .title  { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 26px; letter-spacing: -0.020em; font-feature-settings: 'ss01','ss02'; }
      .body   { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 14px; letter-spacing: -0.005em; }
      .mono   { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 13px; }
    </style>
    <filter id="ambient" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="9" flood-color="#1a1d28" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#C88800"/>
    </marker>
  </defs>

  <g transform="translate(40, 80)">
    <!-- 1 · I.decide (260×150, centred on y=150) -->
    <g transform="translate(43, 75)">
      <path d="M0,0 L260,0 L274,-8 L14,-8 Z" fill="#F1F5F9"/>
      <path d="M260,0 L274,-8 L274,142 L260,150 Z" fill="#E2E8F0"/>
      <rect width="260" height="150" fill="#FFFFFF" filter="url(#ambient)"/>
      <text x="24" y="32" class="kicker" font-family="'JetBrains Mono', monospace" fill="#C88800">Assert</text>
      <rect x="24" y="46" width="212" height="84" rx="8" fill="#FAFAF7" stroke="#F0EDE5" stroke-width="1"/>
      <text x="38" y="68" class="mono" font-family="'JetBrains Mono', monospace" fill="#1F2937"><tspan fill="#C88800">I.decide</tspan>([</text>
      <text x="54" y="86" class="mono" font-family="'JetBrains Mono', monospace" fill="#1F2937">'user is logged in',</text>
      <text x="54" y="104" class="mono" font-family="'JetBrains Mono', monospace" fill="#1F2937">'user can logout',</text>
      <text x="38" y="122" class="mono" font-family="'JetBrains Mono', monospace" fill="#1F2937">])</text>
    </g>

    <!-- 2 · Jev (220×150, centred on y=150) -->
    <g transform="translate(373, 75)">
      <path d="M0,0 L220,0 L234,-8 L14,-8 Z" fill="#F1F5F9"/>
      <path d="M220,0 L234,-8 L234,142 L220,150 Z" fill="#E2E8F0"/>
      <rect width="220" height="150" fill="#FFFFFF" filter="url(#ambient)"/>
      <text x="24" y="32" class="kicker" font-family="'JetBrains Mono', monospace" fill="#C88800">Decision model</text>
      <text x="24" y="68" class="title" font-family="'Bricolage Grotesque', sans-serif" fill="#111827">Jev</text>
      <text x="24" y="100" class="body" font-family="Inter, sans-serif" fill="#4B5563">Reads the page and</text>
      <text x="24" y="120" class="body" font-family="Inter, sans-serif" fill="#4B5563">scores each statement</text>
    </g>

    <!-- 3 · Pass (honey container, 300×120, centred on y=60) -->
    <g transform="translate(677, 0)">
      <path d="M0,0 L300,0 L314,-8 L14,-8 Z" fill="#FFF1D6"/>
      <path d="M300,0 L314,-8 L314,112 L300,120 Z" fill="#F5E5B0"/>
      <rect width="300" height="120" fill="#FFFBF0" filter="url(#ambient)"/>
      <text x="24" y="32" class="kicker" font-family="'JetBrains Mono', monospace" fill="#C88800">Confidence high</text>
      <text x="24" y="66" class="title" font-family="'Bricolage Grotesque', sans-serif" fill="#111827">Pass</text>
      <text x="24" y="96" class="mono" font-family="'JetBrains Mono', monospace" fill="#64748B">user is logged in</text>
      <text x="276" y="96" text-anchor="end" class="mono" font-family="'JetBrains Mono', monospace" fill="#111827" font-weight="700">0.97</text>
    </g>

    <!-- 4 · Fail (300×120, centred on y=240) -->
    <g transform="translate(677, 180)">
      <path d="M0,0 L300,0 L314,-8 L14,-8 Z" fill="#F1F5F9"/>
      <path d="M300,0 L314,-8 L314,112 L300,120 Z" fill="#E2E8F0"/>
      <rect width="300" height="120" fill="#FFFFFF" filter="url(#ambient)"/>
      <text x="24" y="32" class="kicker" font-family="'JetBrains Mono', monospace" fill="#94A3B8">Confidence low</text>
      <text x="24" y="66" class="title" font-family="'Bricolage Grotesque', sans-serif" fill="#111827">Fail</text>
      <text x="24" y="96" class="mono" font-family="'JetBrains Mono', monospace" fill="#64748B">user can logout</text>
      <text x="276" y="96" text-anchor="end" class="mono" font-family="'JetBrains Mono', monospace" fill="#111827" font-weight="700">0.42</text>
    </g>

    <!-- Arrows: card edge + right face (14) + 4 gap -->
    <g stroke="#C88800" stroke-width="2.2" fill="none" stroke-linecap="round" marker-end="url(#arrowGold)">
      <path d="M321,150 L369,150"/>
      <path d="M611,150 L632,150 Q640,150 640,142 L640,68 Q640,60 648,60 L673,60"/>
      <path d="M611,150 L632,150 Q640,150 640,158 L640,232 Q640,240 648,240 L673,240"/>
    </g>
  </g>
</svg>
